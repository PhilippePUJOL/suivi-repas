name: Publication GitHub Pages

# Publie l'application (fichiers statiques) sur GitHub Pages à chaque envoi sur main.
# Seuls les dossiers nécessaires au navigateur sont publiés : ni docs, ni tests, ni supabase.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site/apps
          cp index.html _site/
          cp -r design-system shared _site/
          cp -r apps/mobile _site/apps/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
