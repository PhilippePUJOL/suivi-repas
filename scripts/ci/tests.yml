name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regles-metier:
    name: Règles métier et schéma (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test

  base-de-donnees:
    name: Base de données (Supabase local + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: supabase db start
      - name: Tests pgTAP
        shell: bash
        run: |
          set +e
          supabase test db 2>&1 | tee resultat-pgtap.txt
          statut=${PIPESTATUS[0]}
          # Les échecs sont repris en annotations, lisibles sans ouvrir les journaux.
          grep -E "not ok|Failed|ERROR|# +(got|expected|Looks like)" resultat-pgtap.txt | head -40 | while IFS= read -r ligne; do
            echo "::error title=pgTAP::${ligne}"
          done
          exit $statut
